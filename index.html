<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUDO WARS - by AetherByte Studios</title>
  <style>
    :root {
      --bg-obsidian: #04070e;
      --bg-grid: rgba(0, 243, 255, 0.07);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-green: #00ff66;
      --neon-yellow: #ffe600;
      --accent-gold: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', Orbitron, Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-obsidian);
      background-image:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        radial-gradient(circle at 50% 35%, rgba(0, 243, 255, 0.14), transparent 70%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* =========================================================
       1. STARTUP SPLASH SCREENS & PRE-MATCH LOBBY OVERLAYS
       ========================================================= */
    .overlay-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #0c1b3a 0%, #02040a 95%);
      z-index: 9900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px;
      text-align: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .overlay-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .studio-logo-box {
      padding: 28px 38px;
      border: 2.5px solid var(--neon-cyan);
      border-radius: 20px;
      background: rgba(5, 12, 28, 0.92);
      box-shadow: 0 0 45px rgba(0, 243, 255, 0.65), inset 0 0 22px rgba(0, 243, 255, 0.3);
      animation: pulseGlow 1.8s infinite alternate;
    }

    .studio-title {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #00f3ff, #ffffff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .studio-sub {
      margin-top: 8px;
      font-size: 0.82rem;
      letter-spacing: 6px;
      color: var(--neon-green);
      text-transform: uppercase;
    }

    .modal-card {
      width: 100%;
      max-width: 510px;
      max-height: 92dvh;
      overflow-y: auto;
      background: linear-gradient(165deg, rgba(10, 22, 46, 0.98), rgba(4, 8, 18, 0.99));
      border: 2px solid var(--neon-cyan);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 0 45px rgba(0, 243, 255, 0.5);
      color: #fff;
    }

    .alien-svg-stage {
      width: 100%;
      height: 205px;
      background: radial-gradient(circle at 50% 50%, #10254c 0%, #03060e 100%);
      border-radius: 14px;
      border: 1.5px solid rgba(0, 243, 255, 0.45);
      margin-bottom: 12px;
      overflow: hidden;
      position: relative;
    }

    .alien-svg-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0, 243, 255, 0.05) 0px, rgba(0, 243, 255, 0.05) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
    }

    .primary-neon-btn {
      background: linear-gradient(90deg, #00e676, #00b0ff);
      color: #001824;
      font-weight: 900;
      font-size: 0.92rem;
      padding: 11px 24px;
      border: 2px solid #ffffff;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.75);
      transition: transform 0.15s ease;
    }

    .primary-neon-btn:active {
      transform: scale(0.95);
    }

    /* PRE-MATCH LOBBY CONTROLS WITH CLEAR SELECTION HIGHLIGHT */
    .lobby-label {
      font-size: 0.68rem;
      font-weight: 900;
      color: #84ffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 8px 0 4px;
      display: block;
      text-align: left;
    }

    .lobby-pill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .lobby-pill {
      background: rgba(6, 18, 38, 0.92);
      border: 1.5px solid rgba(0, 243, 255, 0.35);
      color: #bfefff;
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lobby-pill:active {
      transform: scale(0.92);
    }

    .lobby-pill.selected {
      background: linear-gradient(135deg, #00ff66, #00b0ff) !important;
      color: #001824 !important;
      border: 2px solid #ffffff !important;
      font-weight: 900 !important;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.8) !important;
      transform: translateY(-2px) scale(1.03);
    }

    .lobby-pill.selected::after {
      content: ' ✓';
      font-weight: 900;
    }

    .lobby-player-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      background: rgba(4, 14, 30, 0.92);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 10px;
      padding: 5px 8px;
      margin-bottom: 5px;
    }

    .lobby-input {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 6px;
      color: #fff;
      padding: 5px 8px;
      font-size: 0.76rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }

    .color-dot-pick {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.4;
      display: inline-block;
      margin: 0 2px;
      transition: all 0.15s ease;
    }

    .color-dot-pick.active-color {
      opacity: 1;
      border-color: #fff;
      transform: scale(1.18);
      box-shadow: 0 0 10px currentColor;
    }

    .role-btn {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 5px 7px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 900;
      cursor: pointer;
      min-width: 68px;
    }

    .role-btn.is-ai {
      background: rgba(255, 0, 127, 0.22);
      border-color: #ff007f;
      color: #ff80ab;
    }

    /* =========================================================
       2. TOP MOBILE APP HUD & PLAYER STATUS BAR
       ========================================================= */
    .top-hud-wrapper {
      width: 100%;
      max-width: 660px;
      padding: 4px 8px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
      z-index: 20;
    }

    .top-title-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .ludo-wars-sign {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 12px;
      background: rgba(10, 22, 44, 0.95);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 16px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.35);
    }

    .mini-ludo-icon {
      display: grid;
      grid-template-columns: repeat(2, 10px);
      grid-template-rows: repeat(2, 10px);
      gap: 2px;
    }
    .mini-q { border-radius: 2px; }
    .mini-q.green { background: #00e676; }
    .mini-q.yellow { background: #ffea00; }
    .mini-q.blue { background: #00b0ff; }
    .mini-q.red { background: #ff1744; }

    .sign-main-title {
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    .hud-control-strip {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      background: rgba(8, 18, 36, 0.94);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 12px;
      padding: 4px 6px;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .cyber-select, .cyber-btn {
      background: rgba(0, 24, 48, 0.92);
      color: #fff;
      border: 1px solid var(--neon-cyan);
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 0.66rem;
      font-weight: 800;
      cursor: pointer;
    }

    .coin-badge {
      background: rgba(255, 204, 0, 0.16);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 3px 8px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 0.68rem;
    }

    .live-players-bar {
      width: 100%;
      max-width: 660px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 2px 8px;
      flex: 0 0 auto;
      z-index: 20;
    }

    .player-hud-card {
      background: rgba(8, 18, 36, 0.92);
      border: 1.5px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6rem;
    }

    .player-hud-card.active-turn {
      border-color: #00ff66;
      background: rgba(0, 42, 22, 0.96);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
    }

    .p-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* =========================================================
       3. 4 MONETIZED BOARD SKINS & FULL-SCREEN 1:1 ARENA STAGE
       ========================================================= */
    .arena-stage {
      flex: 1 1 auto;
      width: 100%;
      max-width: 660px;
      min-height: 0;
      padding: 4px 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .hybrid-board-frame {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: linear-gradient(145deg, #070b16 0%, #020409 100%);
      border: 2.5px solid #00f3ff;
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.35), inset 0 0 16px rgba(0, 243, 255, 0.2);
    }

    /* Skin 2: Transparent Hologram Glass */
    body.board-glass .hybrid-board-frame {
      background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(0,243,255,0.1));
      backdrop-filter: blur(5px);
      border-color: #b4faff;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.65), inset 0 0 25px rgba(255, 255, 255, 0.25);
    }
    body.board-glass .ludo-cell-15, body.board-glass .matrix-tile {
      background: rgba(255, 255, 255, 0.06) !important;
      border-color: rgba(0, 243, 255, 0.5) !important;
    }

    /* Skin 3: 24K Royal Gold VIP */
    body.board-gold .hybrid-board-frame {
      background: radial-gradient(circle, #2b1d03 0%, #090600 90%);
      border-color: #ffd700;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.65), inset 0 0 20px rgba(255, 180, 0, 0.35);
    }
    body.board-gold .ludo-cell-15, body.board-gold .matrix-tile {
      background: rgba(255, 200, 0, 0.09) !important;
      border-color: rgba(255, 215, 0, 0.45) !important;
      color: #ffe57f !important;
    }

    /* Skin 4: Cyber Matrix Overdrive */
    body.board-matrix .hybrid-board-frame {
      background: linear-gradient(180deg, #011405 0%, #000601 100%);
      border-color: #00ff41;
      box-shadow: 0 0 35px rgba(0, 255, 65, 0.65);
    }
    body.board-matrix .ludo-cell-15, body.board-matrix .matrix-tile {
      background: rgba(0, 255, 65, 0.08) !important;
      border-color: rgba(0, 255, 65, 0.45) !important;
      color: #39ff14 !important;
    }

    .wing-panel {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .wing-header {
      font-size: 0.68rem;
      color: #00f3ff;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      width: min(88vw, 56dvh);
      padding: 0 4px;
      letter-spacing: 0.5px;
    }

    /* FULL-SCREEN STRICT 1:1 SQUARE ARENA BOX (ZERO OVERFLOW!) */
    .square-arena-box {
      position: relative;
      width: min(88vw, 56dvh);
      height: min(88vw, 56dvh);
      aspect-ratio: 1 / 1;
      border: 2px solid var(--neon-cyan);
      border-radius: 12px;
      background: rgba(3, 10, 24, 0.94);
      box-shadow: inset 0 0 18px rgba(0, 243, 255, 0.25);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 15x15 CLASSIC LUDO GRID */
    .real-ludo-15x15 {
      position: absolute;
      inset: 4px;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      gap: 1.5px;
    }

    .ludo-corner-base {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      place-items: center;
      padding: 6px;
      border-radius: 8px;
      position: relative;
    }
    .ludo-base-p0 { grid-area: 1/1/7/7; background: rgba(0, 255, 102, 0.14); border: 2px solid #00ff66; box-shadow: inset 0 0 12px rgba(0,255,102,0.3); }
    .ludo-base-p2 { grid-area: 1/10/7/16; background: rgba(255, 230, 0, 0.14); border: 2px solid #ffe600; box-shadow: inset 0 0 12px rgba(255,230,0,0.3); }
    .ludo-base-p1 { grid-area: 10/1/16/7; background: rgba(255, 23, 68, 0.14); border: 2px solid #ff1744; box-shadow: inset 0 0 12px rgba(255,23,68,0.3); }
    .ludo-base-p3 { grid-area: 10/10/16/16; background: rgba(0, 243, 255, 0.14); border: 2px solid #00f3ff; box-shadow: inset 0 0 12px rgba(0,243,255,0.3); }

    .base-yard-slot {
      width: 68%;
      height: 68%;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.48);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .yard-mini-pawn {
      width: 56%;
      height: 56%;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    .base-lock-tag {
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.5rem;
      font-weight: 900;
      background: rgba(0,0,0,0.85);
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      letter-spacing: 0.4px;
    }

    .ludo-center-crown {
      grid-area: 7/7/10/10;
      background: conic-gradient(from 45deg, rgba(255,230,0,0.5) 0deg 90deg, rgba(0,243,255,0.5) 90deg 180deg, rgba(255,23,68,0.5) 180deg 270deg, rgba(0,255,102,0.5) 270deg 360deg);
      border: 2px solid #ffd700;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
      position: relative;
    }

    .ludo-cell-15 {
      background: rgba(12, 28, 54, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(0.5rem, 1.5vw, 0.68rem);
      font-weight: 900;
      color: rgba(255,255,255,0.85);
      position: relative;
    }
    .ludo-cell-15.home-p0, .ludo-cell-15.start-p0 { background: rgba(0, 255, 102, 0.3) !important; border-color: #00ff66 !important; }
    .ludo-cell-15.home-p1, .ludo-cell-15.start-p1 { background: rgba(255, 23, 68, 0.32) !important; border-color: #ff1744 !important; }
    .ludo-cell-15.home-p2, .ludo-cell-15.start-p2 { background: rgba(255, 230, 0, 0.3) !important; border-color: #ffe600 !important; }
    .ludo-cell-15.home-p3, .ludo-cell-15.start-p3 { background: rgba(0, 243, 255, 0.3) !important; border-color: #00f3ff !important; }
    .ludo-cell-15.ludo-star-tile { border-color: #ff007f !important; box-shadow: inset 0 0 6px rgba(255,0,127,0.55); color: #ffeb3b; }

    /* 1-100 SNAKE MATRIX & EXACT ALIGNED 3D SVG INSIDE SQUARE BOX */
    .numbered-matrix {
      position: absolute;
      inset: 4px;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 2px;
      z-index: 1;
    }

    .snakes-ladders-svg {
      position: absolute;
      inset: 4px;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .matrix-tile {
      background: rgba(10, 24, 48, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.28);
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(0.55rem, 1.8vw, 0.76rem);
      font-weight: 800;
      color: rgba(215, 248, 255, 0.92);
      position: relative;
    }

    .matrix-tile.tile-start { border: 1.5px solid #00ff66 !important; color: #00ff66 !important; }
    .matrix-tile.hatchery-tile { border-color: #ffe600 !important; color: #ffe600 !important; background: rgba(255,230,0,0.1); }
    .matrix-tile.tile-100 {
      z-index: 12 !important;
      background: linear-gradient(135deg, #ffd700, #ff9100) !important;
      color: #000 !important;
      font-weight: 900 !important;
      border: 2px solid #ffffff !important;
      box-shadow: 0 0 15px #ffd700 !important;
    }

    .trailer-snake-3d {
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.92));
    }

    /* SNAKE BITE JAWS, SLIDING VICTIM TOKEN & DODGE SHIELD FX */
    .sliding-victim-token {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      z-index: 60;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 900;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 22px #ff1744, 0 0 35px #00ff66;
      transition: left 0.045s linear, top 0.045s linear;
    }

    .venom-bite-fx {
      position: absolute;
      inset: -12px;
      border: 3px solid #ff1744;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 23, 68, 0.85) 0%, transparent 70%);
      z-index: 55;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      animation: jawSnapAnim 0.45s ease-out forwards;
      pointer-events: none;
    }

    .dodge-shield-fx {
      position: absolute;
      inset: -10px;
      border: 2.5px solid #00ff66;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 255, 102, 0.55) 0%, transparent 75%);
      box-shadow: 0 0 22px #00ff66;
      z-index: 55;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.62rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 6px #000;
      animation: shieldPopAnim 0.95s ease-out forwards;
      pointer-events: none;
    }

    @keyframes jawSnapAnim {
      0%   { transform: scale(2.2); opacity: 0; }
      45%  { transform: scale(0.85); opacity: 1; }
      100% { transform: scale(1.1); opacity: 0; }
    }

    @keyframes shieldPopAnim {
      0%   { transform: scale(0.4); opacity: 0; }
      35%  { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* LIVE WALKING TOKENS */
    .board-live-token, .ludo-live-token {
      width: 74%;
